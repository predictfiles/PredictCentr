<svg viewBox="0 0 1200 630" width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161d" />
      <stop offset="100%" stop-color="#241531" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b5b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ff6b5b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="230" cy="330" r="260" fill="url(#glow)" />

  <!-- basketball glyph -->
  <g transform="translate(230,330)" fill="none" stroke="#ff6b5b" stroke-width="7" stroke-linecap="round">
    <circle r="150" />
    <path d="M -150,0 A 150,150 0 0 1 150,0" />
    <path d="M -150,0 A 150,150 0 0 0 150,0" />
    <path d="M 0,-150 Q 60,0 0,150" />
    <path d="M 0,-150 Q -60,0 0,150" />
  </g>

  <text x="470" y="270" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700"
        letter-spacing="4" fill="#ff6b5b">PREDICTCENTR NEWS</text>

  <text x="465" y="345" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" fill="#f5f6f8">
    KAWHI LEONARD
  </text>
  <text x="465" y="400" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#9aa3b2"
        letter-spacing="1">
    NEXT TEAM WATCH
  </text>

  <text x="465" y="460" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#f5f6f8">
    Los Angeles Clippers
  </text>
  <g transform="translate(730,451)" stroke="#9aa3b2" stroke-width="4" stroke-linecap="round">
    <line x1="0" y1="0" x2="46" y2="0" />
    <polyline points="34,-10 46,0 34,10" fill="none" />
  </g>
  <text x="790" y="460" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#f5f6f8">
    Toronto Raptors
  </text>

  <rect x="470" y="500" width="640" height="8" rx="4" fill="url(#brand)" />
</svg>
